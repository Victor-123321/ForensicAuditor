<svg xmlns="http://www.w3.org/2000/svg" viewBox="139 55 480 480" role="img" aria-label="CORPIDE">
  <title>CORPIDE</title>
  <!-- A company graph with the evidence trail in red: the product in one picture. -->
  <rect x="139" y="55" width="480" height="480" fill="#0D2A42"/>
  <g stroke-width="19">
    <g stroke="#5E7385">
      <line x1="229" y1="240" x2="229" y2="431"/>
      <line x1="229" y1="240" x2="331" y2="308"/>
      <line x1="426" y1="281" x2="529" y2="418"/>
      <line x1="529" y1="158" x2="529" y2="418"/>
    </g>
    <g stroke="#C4505A">
      <line x1="229" y1="431" x2="331" y2="308"/>
      <line x1="331" y1="308" x2="426" y2="281"/>
      <line x1="426" y1="281" x2="529" y2="158"/>
    </g>
  </g>
  <g fill="#FFFFFF">
    <circle cx="229" cy="240" r="28"/>
    <circle cx="229" cy="431" r="36"/>
    <circle cx="331" cy="308" r="28"/>
    <circle cx="426" cy="281" r="28"/>
    <circle cx="529" cy="158" r="36"/>
    <circle cx="529" cy="418" r="28"/>
  </g>
</svg>
